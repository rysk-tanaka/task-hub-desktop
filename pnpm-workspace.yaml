approveBuilds: esbuild
# Renovate's minimumReleaseAge does not cover lock file maintenance, so pnpm itself
# must refuse versions published less than 3 days (4320 minutes) ago, transitive ones included.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: vite@7.3.7
  - vite@7.3.7
